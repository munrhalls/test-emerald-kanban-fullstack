# no-mistakes repo config for test-emerald-kanban-fullstack.
#
# product_surface is a scope-check declaration, not a daemon field: the repo
# config parser ignores unknown keys, and the scope-check skill reads this
# block to assert 1:1 coverage between the product's live surfaces and the
# pipeline's coverage mechanisms before any `axi run`.

product_surface:
  - path: "src/app/page.tsx"
    kind: web-ui
    drives: "npm run dev, then open http://localhost:3000; the home page renders the Emerald theme shell and the live conduit card fed by getTracerValue() in src/lib/tracer.ts"
  - path: "src/app/todos/page.tsx"
    kind: web-ui
    drives: "npm run dev, then open http://localhost:3000/todos; add a todo via the form, toggle it done via the circular check button, delete it via the Delete button - each action is a server action hitting the live Supabase todos table (src/lib/todos/*.ts). Verify the list updates and a row persists in Supabase across a manual page refresh. Check a narrow portrait viewport and a landscape viewport for overflow."
  - path: lib
    kind: library
    drives: [typecheck]
  - path: supabase/migrations
    kind: sql-migrations
    drives: [manual-review]  # applied to hosted Supabase; no local DB in this repo
  - path: supabase/README.md
    kind: docs
    drives: [manual-review]

commands:
  lint: "npm run lint"
  test: npm run typecheck

test:
  instructions: |
    Product surfaces and how to drive them live:
    - Web UI: `npm run dev` (or `npm run build && npm run start`), then open
      http://localhost:3000 in a browser. Verify the Emerald theme renders
      (dark green-black background, emerald accents, Fraunces display font)
      and the "Live conduit" card shows the value returned by
      `getTracerValue()` from `src/lib/tracer.ts` (currently a hardcoded
      placeholder string until wired to lib/getTracerValue.ts). Check at
      least one narrow portrait viewport and one landscape viewport for
      horizontal overflow or broken layout.
    - Data layer: the live surface is the hosted Supabase project (tracer
      table) plus the typed client in lib/. Validate by running
      `npm run typecheck` and, when NEXT_PUBLIC_SUPABASE_URL /
      NEXT_PUBLIC_SUPABASE_ANON_KEY are set, calling getTracerValue() and
      expecting the seed message. Without credentials the migration SQL and
      client factory are reviewed statically.
    - Todos: `src/lib/todos/{read,create,update,delete}.ts` are server
      actions against the hosted Supabase `todos` table (migration
      supabase/migrations/20260922000000_create_todos.sql). Requires that
      migration to have been applied to the live project (it is not applied
      automatically - there is no linked Supabase CLI project or DB
      credential in this environment; apply it once via the Supabase
      dashboard SQL editor per supabase/README.md Option B). Once applied,
      drive it live via the /todos page above; without it applied, the page
      still renders (empty state or a Supabase error) and the code is
      reviewed statically.
    `npm run lint` must pass. There is no unit-test suite yet; the live
    browser drive is the behavioral evidence for this milestone.

ignore_patterns:
  - node_modules/**
  - package-lock.json
